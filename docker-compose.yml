name: performance-agent

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: performance-agent-api:local
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      K6_BIN: k6
      DB_PATH: /app/apps/api/storage/database.sqlite
      UPLOAD_DIR: /app/apps/api/storage/uploads
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    volumes:
      - api-storage:/app/apps/api/storage
      - api-logs:/app/apps/api/logs
    expose:
      - "4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: performance-agent-web:local
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-storage:
  api-logs:
