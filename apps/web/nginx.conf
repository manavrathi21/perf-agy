upstream perf_api {
    # `api` is the compose service name; port 4000 is the API's internal port.
    server api:4000;
}

server {
    listen 80;
    server_name _;

    # Larger request bodies for collection / env uploads. Matches
    # MAX_UPLOAD_SIZE_MB on the API side (10 MB default + headroom).
    client_max_body_size 25m;

    # Gzip the static assets we built with Vite.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to the API. Preserve Host and client IP so the API's
    # CORS + logging see the real origin.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Long k6 runs: give the API room to finish before nginx drops the
        # socket. The API itself enforces MAX_RUN_TIME_MS.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;

        proxy_pass http://perf_api;
    }

    # SPA fallback: unknown routes resolve to index.html so the React
    # router can take over on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
